<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Attest — Arquitectura actual derivada del código</title>
  <desc id="desc">Diagrama por capas de la aplicación web multipágina, Fly Proxy, monolito Express, stores SQLite y filesystem local en volumen Fly.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="headBg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <style>
      .title{font:700 30px Inter,"Segoe UI",sans-serif;fill:#fff}.subtitle{font:400 15px Inter,"Segoe UI",sans-serif;fill:#cbd5e1}
      .badge{font:700 12px Inter,"Segoe UI",sans-serif;fill:#dbeafe;letter-spacing:1.4px}.layer{font:700 13px Inter,"Segoe UI",sans-serif;fill:#475569;letter-spacing:1.5px}
      .boxTitle{font:700 16px Inter,"Segoe UI",sans-serif;fill:#0f172a}.boxText{font:400 13px Inter,"Segoe UI",sans-serif;fill:#475569}.small{font:400 12px Inter,"Segoe UI",sans-serif;fill:#64748b}
      .noteTitle{font:700 14px Inter,"Segoe UI",sans-serif;fill:#7c2d12}.noteText{font:400 12px Inter,"Segoe UI",sans-serif;fill:#9a3412}
      .panel{stroke-width:1.5}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.2;rx:12;filter:url(#shadow)}
      .flow{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.primary{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrowBlue)}
      .dash{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="url(#pageBg)"/>
  <rect x="0" y="0" width="1600" height="82" fill="url(#headBg)"/>
  <text x="42" y="38" class="title">Attest — Arquitectura actual derivada del código</text>
  <text x="42" y="63" class="subtitle">Estado AS-BUILT · aplicación sintética en desarrollo · snapshot 2026-08-08</text>
  <rect x="1390" y="23" width="165" height="34" rx="17" fill="#1d4ed8"/><text x="1472" y="45" text-anchor="middle" class="badge">ESTADO ACTUAL</text>

  <!-- Frontend -->
  <rect x="30" y="104" width="1540" height="244" rx="18" fill="#eff6ff" stroke="#93c5fd" class="panel"/>
  <text x="55" y="132" class="layer">CAPA FRONTEND · NAVEGADOR</text>
  <rect x="60" y="155" width="285" height="155" class="box"/>
  <text x="82" y="184" class="boxTitle">MPA estática</text>
  <text x="82" y="208" class="boxText"><tspan x="82">14 vistas HTML autenticadas</tspan><tspan x="82" dy="20">Dashboard, Reviews, Campaigns,</tspan><tspan x="82" dy="20">SoD, Evidence, Admin, Settings…</tspan><tspan x="82" dy="20">Scripts inline por página</tspan></text>
  <rect x="370" y="155" width="250" height="155" class="box"/>
  <text x="392" y="184" class="boxTitle">Web Components</text>
  <text x="392" y="208" class="boxText"><tspan x="392">components.js</tspan><tspan x="392" dy="20">Sidebar · topbar · logo</tspan><tspan x="392" dy="20">Mobile tabbar</tspan><tspan x="392" dy="20">styles.css + tokens</tspan></text>
  <rect x="645" y="155" width="315" height="155" class="box"/>
  <text x="667" y="184" class="boxTitle">Contexto y cliente compartido</text>
  <text x="667" y="208" class="boxText"><tspan x="667">shared.js · apiClient único</tspan><tspan x="667" dy="20">JWT en localStorage</tspan><tspan x="667" dy="20">usuario, memberships y tenant activo</tspan><tspan x="667" dy="20">abort/invalidate al cambiar tenant</tspan></text>
  <rect x="985" y="155" width="260" height="155" class="box"/>
  <text x="1007" y="184" class="boxTitle">Lógica de presentación</text>
  <text x="1007" y="208" class="boxText"><tspan x="1007">app.js + scripts de página</tspan><tspan x="1007" dy="20">Estado DOM/localStorage</tspan><tspan x="1007" dy="20">Chart.js · jsPDF</tspan><tspan x="1007" dy="20">Render y permisos visuales</tspan></text>
  <rect x="1270" y="155" width="270" height="155" class="box"/>
  <text x="1292" y="184" class="boxTitle">App shell / caché</text>
  <text x="1292" y="208" class="boxText"><tspan x="1292">sw.js · cache-first estático</tspan><tspan x="1292" dy="20">manifest.json</tspan><tspan x="1292" dy="20">mobile.js responsive</tspan><tspan x="1292" dy="20">APIs siempre network</tspan></text>
  <path d="M345 232 H370" class="flow"/><path d="M620 232 H645" class="flow"/><path d="M960 232 H985" class="flow"/><path d="M1245 232 H1270" class="flow"/>

  <!-- Runtime -->
  <rect x="30" y="374" width="1540" height="404" rx="18" fill="#f8fafc" stroke="#94a3b8" class="panel"/>
  <text x="55" y="402" class="layer">CAPAS EDGE, HTTP Y BACKEND · UN SOLO PROCESO NODE.JS</text>
  <rect x="62" y="432" width="225" height="126" class="box"/>
  <text x="84" y="461" class="boxTitle">Fly.io Edge</text>
  <text x="84" y="485" class="boxText"><tspan x="84">TLS + HTTP proxy</tspan><tspan x="84" dy="20">Health TCP :3000</tspan><tspan x="84" dy="20">1 máquina · región iad</tspan></text>
  <rect x="320" y="422" width="1215" height="320" rx="16" fill="#fff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="346" y="453" class="boxTitle">Monolito Express 5 sobre Node.js · server.js</text>
  <text x="346" y="474" class="small">Proceso HTTP, imports, jobs y generación de evidencia comparten CPU, memoria y ciclo de vida.</text>

  <rect x="350" y="497" width="220" height="88" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="368" y="522" class="boxTitle">Middleware HTTP</text><text x="368" y="544" class="boxText"><tspan x="368">requestId · headers · no-store</tspan><tspan x="368" dy="18">rate limit auth · error JSON</tspan></text>
  <rect x="590" y="497" width="240" height="88" rx="10" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="608" y="522" class="boxTitle">Auth y TenantContext</text><text x="608" y="544" class="boxText"><tspan x="608">JWT/API key → principal</tspan><tspan x="608" dy="18">membership → capabilities</tspan></text>
  <rect x="850" y="497" width="260" height="88" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="868" y="522" class="boxTitle">Policy enforcement</text><text x="868" y="544" class="boxText"><tspan x="868">RBAC/capabilities server-side</tspan><tspan x="868" dy="18">IDs por (tenant_id, id)</tspan></text>
  <rect x="1130" y="497" width="370" height="88" rx="10" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="1148" y="522" class="boxTitle">Rutas Express</text><text x="1148" y="544" class="boxText"><tspan x="1148">auth · review · compliance</tspan><tspan x="1148" dy="18">admin · dashboard</tspan></text>

  <rect x="350" y="610" width="350" height="96" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="368" y="635" class="boxTitle">Reglas y flujos en proceso</text><text x="368" y="657" class="boxText"><tspan x="368">Campaign / review / SoD / evidence</tspan><tspan x="368" dy="18">Validaciones repartidas entre routes y stores</tspan><tspan x="368" dy="18">Notificaciones y activity best-effort</tspan></text>
  <rect x="725" y="610" width="355" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="743" y="635" class="boxTitle">Stores / adapters</text><text x="743" y="657" class="boxText"><tspan x="743">campaignStore · logStore · sodStore</tspan><tspan x="743" dy="18">roleCatalogStore · evidenceStore…</tspan><tspan x="743" dy="18">better-sqlite3 síncrono</tspan></text>
  <rect x="1105" y="610" width="395" height="96" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1123" y="635" class="boxTitle">Carga y trabajo síncrono/in-process</text><text x="1123" y="657" class="boxText"><tspan x="1123">seed-on-first-run · ExcelJS imports</tspan><tspan x="1123" dy="18">SoD detect · ZIP evidence · setImmediate</tspan><tspan x="1123" dy="18">Sin cola durable ni outbox</tspan></text>
  <path d="M287 495 H320" class="primary"/><path d="M803 310 V358 H175 V432" class="primary"/>
  <path d="M570 541 H590" class="flow"/><path d="M830 541 H850" class="flow"/><path d="M1110 541 H1130" class="flow"/>
  <path d="M1315 585 V598 H525 V610" class="flow"/><path d="M700 658 H725" class="flow"/><path d="M1080 658 H1105" class="dash"/>

  <!-- Data -->
  <rect x="30" y="806" width="1540" height="282" rx="18" fill="#f0fdf4" stroke="#86efac" class="panel"/>
  <text x="55" y="834" class="layer">CAPA DE DATOS · VOLUMEN PERSISTENTE ÚNICO EN FLY.IO</text>
  <rect x="80" y="860" width="680" height="154" class="box"/>
  <text x="104" y="890" class="boxTitle">SQLite WAL · /app/data/attest.db</text>
  <text x="104" y="916" class="boxText"><tspan x="104">Identidad: user_accounts, tenant_memberships, tenants, API keys</tspan><tspan x="104" dy="20">GRC: campaigns, submissions/RITM, activity, notifications</tspan><tspan x="104" dy="20">Acceso/SoD: subjects, applications, accounts, entitlements, assignments, rules, conflicts</tspan><tspan x="104" dy="20">Aislamiento aplicado por queries tenant-scoped; sin RLS ni HA</tspan></text>
  <rect x="800" y="860" width="415" height="154" class="box"/>
  <text x="824" y="890" class="boxTitle">Filesystem local · mismo volumen</text>
  <text x="824" y="916" class="boxText"><tspan x="824">/app/data/sources/*.xlsx</tspan><tspan x="824" dy="20">/app/data/evidence/*.zip</tspan><tspan x="824" dy="20">Swap/rollback local de uploads</tspan><tspan x="824" dy="20">Sin object versioning, KMS o retention lock</tspan></text>
  <rect x="1255" y="860" width="270" height="154" rx="12" fill="#fff7ed" stroke="#fdba74" filter="url(#shadow)"/>
  <text x="1277" y="890" class="noteTitle">Límites actuales</text>
  <text x="1277" y="914" class="noteText"><tspan x="1277">• catálogo mutable</tspan><tspan x="1277" dy="19">• scope de campaña vivo</tspan><tspan x="1277" dy="19">• instancia/volumen únicos</tspan><tspan x="1277" dy="19">• jobs no durables</tspan><tspan x="1277" dy="19">• evidencia local</tspan></text>
  <path d="M902 706 V790 H420 V860" class="primary"/><path d="M1302 706 V790 H1008 V860" class="primary"/>
  <path d="M760 937 H800" class="dash"/>
  <text x="55" y="1064" class="small">Flecha sólida: llamada síncrona · Flecha discontinua: side effect o dependencia débil · El tenant se resuelve desde principal + membership antes de las rutas.</text>
</svg>
