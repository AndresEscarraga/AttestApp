<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">Attest — Arquitectura objetivo posterior al roadmap</title>
  <desc id="desc">Arquitectura final por capas con frontend tenant-aware, gateway de sesión, monolito modular, PostgreSQL con RLS, outbox, workers, object storage y observabilidad.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <linearGradient id="headBg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#082f49"/><stop offset=".55" stop-color="#164e63"/><stop offset="1" stop-color="#134e4a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0284c7"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#059669"/></marker>
    <style>
      .title{font:700 30px Inter,"Segoe UI",sans-serif;fill:#fff}.subtitle{font:400 15px Inter,"Segoe UI",sans-serif;fill:#cffafe}
      .badge{font:700 12px Inter,"Segoe UI",sans-serif;fill:#d1fae5;letter-spacing:1.4px}.layer{font:700 13px Inter,"Segoe UI",sans-serif;fill:#475569;letter-spacing:1.5px}
      .boxTitle{font:700 16px Inter,"Segoe UI",sans-serif;fill:#0f172a}.boxText{font:400 13px Inter,"Segoe UI",sans-serif;fill:#475569}.small{font:400 12px Inter,"Segoe UI",sans-serif;fill:#64748b}
      .guard{font:700 12px Inter,"Segoe UI",sans-serif;fill:#0369a1}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.2;rx:12;filter:url(#shadow)}
      .flow{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.primary{fill:none;stroke:#0284c7;stroke-width:2.5;marker-end:url(#arrowBlue)}
      .data{fill:none;stroke:#059669;stroke-width:2.5;marker-end:url(#arrowGreen)}.async{fill:none;stroke:#7c3aed;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1320" fill="url(#pageBg)"/>
  <rect x="0" y="0" width="1800" height="86" fill="url(#headBg)"/>
  <text x="42" y="39" class="title">Attest — Arquitectura objetivo posterior al roadmap</text>
  <text x="42" y="65" class="subtitle">Estado TO-BE · monolito modular + workers · multi-tenant enterprise defendible</text>
  <rect x="1570" y="24" width="185" height="35" rx="18" fill="#047857"/><text x="1662" y="47" text-anchor="middle" class="badge">ARQUITECTURA FINAL</text>

  <!-- External inputs -->
  <rect x="35" y="110" width="210" height="176" rx="16" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="58" y="141" class="boxTitle">Actores y sistemas</text>
  <text x="58" y="169" class="boxText"><tspan x="58">Usuarios GRC / auditores</tspan><tspan x="58" dy="24">IdP OIDC/SAML + MFA</tspan><tspan x="58" dy="24">HRIS / SCIM</tspan><tspan x="58" dy="24">ERP / IAM / SaaS</tspan><tspan x="58" dy="24">Ticketing / correo / webhooks</tspan></text>

  <!-- Frontend -->
  <rect x="275" y="110" width="1490" height="176" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="300" y="138" class="layer">CAPA FRONTEND · WEB APP COMPILADA Y TENANT-AWARE</text>
  <rect x="305" y="157" width="300" height="100" class="box"/>
  <text x="325" y="184" class="boxTitle">App shell accesible</text><text x="325" y="207" class="boxText"><tspan x="325">Vistas modulares + design system</tspan><tspan x="325" dy="19">WCAG AA · teclado · responsive</tspan></text>
  <rect x="630" y="157" width="330" height="100" class="box"/>
  <text x="650" y="184" class="boxTitle">Session / Tenant Provider</text><text x="650" y="207" class="boxText"><tspan x="650">Usuario, memberships y capabilities</tspan><tspan x="650" dy="19">Cambio A→B atómico; estado invalidado</tspan></text>
  <rect x="985" y="157" width="330" height="100" class="box"/>
  <text x="1005" y="184" class="boxTitle">API client + query cache</text><text x="1005" y="207" class="boxText"><tspan x="1005">Claves incluyen tenantId + snapshotId</tspan><tspan x="1005" dy="19">Abort, retry, errores y 401 centralizados</tspan></text>
  <rect x="1340" y="157" width="395" height="100" class="box"/>
  <text x="1360" y="184" class="boxTitle">Módulos de experiencia GRC</text><text x="1360" y="207" class="boxText"><tspan x="1360">Campaigns · Reviews · SoD · Evidence</tspan><tspan x="1360" dy="19">Lifecycle · Audit · Admin · Integrations</tspan></text>
  <path d="M245 178 H305" class="primary"/><path d="M605 207 H630" class="flow"/><path d="M960 207 H985" class="flow"/><path d="M1315 207 H1340" class="flow"/>

  <!-- Edge + identity -->
  <rect x="35" y="316" width="1730" height="170" rx="18" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="60" y="344" class="layer">CAPAS EDGE, IDENTIDAD Y SESIÓN</text>
  <rect x="70" y="365" width="300" height="90" class="box"/>
  <text x="90" y="392" class="boxTitle">CDN / WAF / Load Balancer</text><text x="90" y="415" class="boxText"><tspan x="90">TLS · límites · headers · health/readiness</tspan><tspan x="90" dy="19">Despliegue horizontal stateless</tspan></text>
  <rect x="425" y="365" width="330" height="90" class="box"/>
  <text x="445" y="392" class="boxTitle">BFF / Session Gateway</text><text x="445" y="415" class="boxText"><tspan x="445">Authorization Code + PKCE</tspan><tspan x="445" dy="19">Cookie HttpOnly/Secure/SameSite</tspan></text>
  <rect x="810" y="365" width="355" height="90" class="box"/>
  <text x="830" y="392" class="boxTitle">Resolución de TenantContext</text><text x="830" y="415" class="boxText"><tspan x="830">principal → membership activa → tenant</tspan><tspan x="830" dy="19">Nunca desde headers controlados por cliente</tspan></text>
  <rect x="1220" y="365" width="510" height="90" class="box"/>
  <text x="1240" y="392" class="boxTitle">Policy Enforcement Point</text><text x="1240" y="415" class="boxText"><tspan x="1240">RBAC + ABAC/ReBAC: capability, tenant, relación y estado</tspan><tspan x="1240" dy="19">Rate limit · requestId · schema validation · error contract</tspan></text>
  <path d="M795 286 V330 H220 V365" class="primary"/><path d="M370 410 H425" class="flow"/><path d="M755 410 H810" class="flow"/><path d="M1165 410 H1220" class="flow"/>

  <!-- Modular monolith -->
  <rect x="35" y="518" width="1730" height="292" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="546" class="layer">CAPA BACKEND · MONOLITO MODULAR STATELESS</text>
  <rect x="70" y="570" width="420" height="200" rx="14" fill="#fff" stroke="#7dd3fc" filter="url(#shadow)"/>
  <text x="92" y="600" class="boxTitle">Plataforma transversal</text>
  <text x="92" y="628" class="boxText"><tspan x="92">HTTP / OpenAPI / validation</tspan><tspan x="92" dy="22">TenantContext + policy</tspan><tspan x="92" dy="22">Transaction boundary + idempotency</tspan><tspan x="92" dy="22">Optimistic concurrency + state machines</tspan><tspan x="92" dy="22">Audit event + transactional outbox</tspan><tspan x="92" dy="22">Errors · telemetry · feature flags</tspan></text>
  <rect x="525" y="570" width="370" height="200" rx="14" fill="#fff" stroke="#86efac" filter="url(#shadow)"/>
  <text x="547" y="600" class="boxTitle">Identity &amp; Access Catalog</text>
  <text x="547" y="628" class="boxText"><tspan x="547">Identity / subject</tspan><tspan x="547" dy="22">Application / account</tspan><tspan x="547" dy="22">Entitlement / assignment efectivo</tspan><tspan x="547" dy="22">Owner / reviewer separados</tspan><tspan x="547" dy="22">Imports tenant-scoped y versionados</tspan><tspan x="547" dy="22">Source snapshots reproducibles</tspan></text>
  <rect x="930" y="570" width="370" height="200" rx="14" fill="#fff" stroke="#c4b5fd" filter="url(#shadow)"/>
  <text x="952" y="600" class="boxTitle">Campaigns &amp; Reviews</text>
  <text x="952" y="628" class="boxText"><tspan x="952">Campaign scope snapshot inmutable</tspan><tspan x="952" dy="22">Review items materializados</tspan><tspan x="952" dy="22">Decision events versionados</tspan><tspan x="952" dy="22">Progress desde el mismo snapshot</tspan><tspan x="952" dy="22">On/offboarding como workflows</tspan><tspan x="952" dy="22">Commands idempotentes</tspan></text>
  <rect x="1335" y="570" width="395" height="200" rx="14" fill="#fff" stroke="#f9a8d4" filter="url(#shadow)"/>
  <text x="1357" y="600" class="boxTitle">Risk, Evidence &amp; Integrations</text>
  <text x="1357" y="628" class="boxText"><tspan x="1357">SoD evaluation + mitigation/risk acceptance</tspan><tspan x="1357" dy="22">Evidence manifests + digests + signatures</tspan><tspan x="1357" dy="22">Audit trail completo y export server-side</tspan><tspan x="1357" dy="22">Notification / ticketing / webhooks</tspan><tspan x="1357" dy="22">Share links hash + expiry + revocation</tspan><tspan x="1357" dy="22">Read models de dashboard/badges</tspan></text>
  <path d="M1475 455 V500 H280 V570" class="primary"/><path d="M490 670 H525" class="flow"/><path d="M895 670 H930" class="flow"/><path d="M1300 670 H1335" class="flow"/>

  <!-- Async -->
  <rect x="35" y="842" width="1730" height="180" rx="18" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="60" y="870" class="layer">CAPA ASÍNCRONA · OUTBOX Y EJECUCIÓN DURABLE</text>
  <rect x="80" y="895" width="300" height="90" class="box"/>
  <text x="100" y="922" class="boxTitle">Transactional Outbox</text><text x="100" y="945" class="boxText"><tspan x="100">Evento + mutación en una transacción</tspan><tspan x="100" dy="19">Replay y deduplicación</tspan></text>
  <rect x="430" y="895" width="270" height="90" class="box"/>
  <text x="450" y="922" class="boxTitle">Cola durable</text><text x="450" y="945" class="boxText"><tspan x="450">Retry/backoff · DLQ</tspan><tspan x="450" dy="19">Idempotency/job key</tspan></text>
  <rect x="750" y="895" width="290" height="90" class="box"/>
  <text x="770" y="922" class="boxTitle">Import workers</text><text x="770" y="945" class="boxText"><tspan x="770">Parse/scan/validate/version</tspan><tspan x="770" dy="19">Publicación atómica de snapshot</tspan></text>
  <rect x="1090" y="895" width="290" height="90" class="box"/>
  <text x="1110" y="922" class="boxTitle">SoD / campaign workers</text><text x="1110" y="945" class="boxText"><tspan x="1110">Materialize review items</tspan><tspan x="1110" dy="19">Detect sin duplicados</tspan></text>
  <rect x="1430" y="895" width="290" height="90" class="box"/>
  <text x="1450" y="922" class="boxTitle">Evidence / delivery workers</text><text x="1450" y="945" class="boxText"><tspan x="1450">ZIP + manifest + KMS sign</tspan><tspan x="1450" dy="19">Notify / ticket / webhook</tspan></text>
  <path d="M280 770 V895" class="async"/><path d="M380 940 H430" class="async"/><path d="M700 940 H750" class="async"/><path d="M700 940 H1090" class="async"/><path d="M700 940 H1430" class="async"/>

  <!-- Data -->
  <rect x="35" y="1054" width="1730" height="226" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="60" y="1082" class="layer">CAPA DE DATOS, EVIDENCIA Y OPERACIÓN</text>
  <rect x="75" y="1105" width="570" height="132" class="box"/>
  <text x="97" y="1134" class="boxTitle">PostgreSQL HA + Row-Level Security</text>
  <text x="97" y="1158" class="boxText"><tspan x="97">Tenant RLS · composite FK · migrations transaccionales</tspan><tspan x="97" dy="20">Identity/account/entitlement/assignment · snapshots/review items/decisions</tspan><tspan x="97" dy="20">Versions · idempotency · outbox · PITR/backups/restore probado</tspan></text>
  <rect x="680" y="1105" width="460" height="132" class="box"/>
  <text x="702" y="1134" class="boxTitle">Object Storage versionado</text>
  <text x="702" y="1158" class="boxText"><tspan x="702">KMS · tenant object keys · malware scan</tspan><tspan x="702" dy="20">Imports originales + evidencia + manifests</tspan><tspan x="702" dy="20">Signed URLs · retention lock/WORM cuando aplique</tspan></text>
  <rect x="1175" y="1105" width="300" height="132" class="box"/>
  <text x="1197" y="1134" class="boxTitle">Audit ledger</text>
  <text x="1197" y="1158" class="boxText"><tspan x="1197">Append-only events</tspan><tspan x="1197" dy="20">Signed checkpoints</tspan><tspan x="1197" dy="20">Verifier independiente</tspan></text>
  <rect x="1510" y="1105" width="220" height="132" class="box"/>
  <text x="1532" y="1134" class="boxTitle">Observabilidad</text>
  <text x="1532" y="1158" class="boxText"><tspan x="1532">Logs/métricas/traces</tspan><tspan x="1532" dy="20">SIEM + alertas</tspan><tspan x="1532" dy="20">Secrets/KMS</tspan></text>
  <path d="M360 770 V1088 H360 V1105" class="data"/><path d="M895 985 V1090 H910 V1105" class="data"/><path d="M1575 985 V1070 H910 V1105" class="data"/><path d="M1575 985 V1085 H1325 V1105" class="data"/>
  <path d="M1620 1105 V795 H1535 V770" class="dash"/>
  <text x="60" y="1262" class="small">Sólida azul: request síncrono · Discontinua violeta: evento/job durable · Verde: persistencia · El monolito modular escala horizontalmente; los workers escalan de forma independiente.</text>
  <text x="60" y="1290" class="guard">INVARIANTE CENTRAL: principal autenticado → membership válida → TenantContext único → policy → repositorio con RLS; todo job, caché, objeto y evento conserva tenantId + snapshotId.</text>
</svg>
