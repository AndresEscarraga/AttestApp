# fly.toml app configuration file generated for roledict on 2026-08-07T01:49:18-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'attestapp'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_STORE = 'local'
  DB_PATH = '/app/data/attest.db'
  NODE_ENV = 'production'
  PORT = '3000'
  REPORTS_DIR = '/app/data/sources'
  ROLES_FILE_NAME = 'Roles Approvers.xlsx'
  TX_FILE_NAME = 'Transactions.xlsx'

[[mounts]]
  source = 'attest_data'
  destination = '/app/data'

[[services]]
  protocol = 'tcp'
  internal_port = 3000
  auto_stop_machines = 'off'
  auto_start_machines = true

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '1m0s'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
