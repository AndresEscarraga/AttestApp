<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attest — Admin Users</title>

  <link rel="stylesheet" href="styles.css" />




<script src="/components.js"></script>
<script src="/shared.js"></script>
</head>
<body class="has-sidebar">
<attest-sidebar active="admin-users"></attest-sidebar>

<div class="main">

<attest-topbar breadcrumb="Attest › <span>Users & Roles</span>" search-placeholder="Search users by email…"></attest-topbar>

  <div class="content">
    <div class="content-header">
      <h1>Users &amp; Roles</h1>
      <p>Manage memberships and roles for the organization currently selected in the sidebar.</p>
    </div>

    <div class="card mb-16">
      <div class="card-header"><h2>Add Membership</h2></div>
      <div class="card-body">
        <form id="adminUserForm" style="display:flex;gap:8px;align-items:flex-end">
          <div class="form-group" style="flex:1;margin:0">
            <label class="form-label">User email</label>
            <input class="form-input" id="adminEmailInput" type="email" placeholder="user@example.com" required />
          </div>
          <div class="form-group" style="width:180px;margin:0">
            <label class="form-label">Role</label>
            <select class="form-select" id="memberRoleInput"><option value="admin">Administrator</option><option value="approver">Approver</option><option value="auditor">Auditor</option></select>
          </div>
          <button class="btn btn-primary" type="submit">Add membership</button>
        </form>
        <p class="text-sm text-danger mt-8" id="adminUserError" style="display:none"></p>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h2>Organization Members</h2></div>
      <div class="card-body no-pad">
        <div class="table-scroll">
          <table class="data-table" id="adminUsersTable">
            <thead><tr><th>Email</th><th>Type</th><th>Action</th></tr></thead>
            <tbody id="adminUsersBody"></tbody>
          </table>
        </div>
        <p class="text-sm text-muted" style="padding:16px;display:none" id="adminUsersEmpty">No memberships found.</p>
      </div>
    </div>
  </div>
<script src="admin-users.js"></script>

<script src="/mobile.js"></script>
</div>
</div>
</div>


<attest-mobile-tabbar active="admin-users"></attest-mobile-tabbar>
</body>
</html>
