  <div class="content">
    <div class="content-header">
      <div><h1>Organization Tenants</h1><p>Manage organizations in your multi-tenant instance. Each tenant has isolated data, campaigns, and users.</p></div>
      <button class="btn btn-primary" id="newTenantBtn">+ New Tenant</button>
    </div>

    <div class="stats-grid" style="margin-bottom:18px">
      <div class="stat-card"><div class="stat-label">Total Tenants</div><div class="stat-value" id="totalCount">—</div></div>
      <div class="stat-card"><div class="stat-label">Active</div><div class="stat-value" style="color:var(--success)" id="activeCount">—</div></div>
      <div class="stat-card"><div class="stat-label">Suspended</div><div class="stat-value" style="color:var(--warning)" id="suspendedCount">—</div></div>
    </div>

    <div class="card">
      <div class="card-header"><h2>All Tenants</h2></div>
      <div class="card-body no-pad">
        <div class="table-scroll">
          <table class="data-table" id="tenantsTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>ID</th>
                <th>Plan</th>
                <th>Status</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tenantsBody">
              <tr><td colspan="6" class="text-sm text-muted" style="text-align:center;padding:30px">Loading tenants…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<!-- New/Edit Tenant Modal -->
<div class="modal-backdrop hidden" id="tenantModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">New Tenant</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-error" id="modalError"></div>
      <div class="form-group">
        <label class="form-label">Organization Name *</label>
        <input class="form-input" id="tenantName" placeholder="e.g. Acme Corporation" maxlength="200">
      </div>
      <div class="form-group">
        <label class="form-label">Plan</label>
        <select class="form-select" id="tenantPlan">
          <option value="starter">Starter</option>
          <option value="professional">Professional</option>
          <option value="enterprise">Enterprise</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalSave">Create Tenant</button>
    </div>
  </div>
<script>
(function() {
  'use strict';
  var el = function(id) { return document.getElementById(id); };
  var state = { tenants: [], editingId: null };

  // Auth handled by shared.js
// Fetch auth inject handled by shared.js

  function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmtDate(iso) { try { return new Date(iso).toLocaleDateString(); } catch(e) { return iso; } }

  async function loadUser() {
    try {
      var res = await fetch('/api/me');
      var me = await res.json().catch(function() { return {}; });
      if (!res.ok || !me.isAdmin) { location.href = '/'; return; }
      var initials = (me.approverName || me.email || 'U').split(' ').map(function(n){return n[0];}).join('').substring(0,2).toUpperCase();
      el('sidebarAvatar').textContent = initials;
      el('sidebarName').textContent = me.approverName || me.email || 'User';
      el('sidebarRole').textContent = 'Administrator';
      // Populate tenant selector
      if (me.tenants && me.tenants.length > 1) {
        var sel = el('tenantSelector');
        if (sel) {
          sel.innerHTML = '';
          me.tenants.forEach(function(t) {
            var o = document.createElement('option');
            o.value = t.id; o.textContent = t.name;
            if (t.id === me.tenantId) o.selected = true;
            sel.appendChild(o);
          });
        }
      }
    } catch(e) { location.href = '/login.html'; }
  }

  async function loadTenants() {
    try {
      var res = await fetch('/api/tenants');
      state.tenants = await res.json();
      render();
    } catch(e) {}
  }

  function render() {
    var tbody = el('tenantsBody');
    el('totalCount').textContent = state.tenants.length;
    el('activeCount').textContent = state.tenants.filter(function(t) { return t.status === 'active'; }).length;
    el('suspendedCount').textContent = state.tenants.filter(function(t) { return t.status === 'suspended'; }).length;

    if (!state.tenants.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-sm text-muted" style="text-align:center;padding:30px">No tenants yet.</td></tr>';
      return;
    }

    var html = '';
    state.tenants.forEach(function(t) {
      var statusBadge = t.status === 'active' ? 'badge-success' : t.status === 'suspended' ? 'badge-warning' : 'badge-neutral';
      var planBadge = t.plan === 'enterprise' ? 'badge-purple' : t.plan === 'professional' ? 'badge-info' : 'badge-neutral';
      html += '<tr>' +
        '<td><strong>' + escHtml(t.name) + '</strong>' + (t.id === 'default' ? ' <span class="badge badge-teal">Default</span>' : '') + '</td>' +
        '<td style="font-family:monospace;font-size:11px">' + escHtml(t.id) + '</td>' +
        '<td><span class="badge ' + planBadge + '">' + t.plan + '</span></td>' +
        '<td><span class="badge ' + statusBadge + '">' + t.status + '</span></td>' +
        '<td class="text-sm text-muted">' + fmtDate(t.created_at) + '</td>' +
        '<td><div class="btn-group">' +
          (t.status === 'active' ? '<button class="btn btn-xs btn-secondary suspend-btn" data-id="' + t.id + '">Suspend</button>' : '') +
          (t.status === 'suspended' ? '<button class="btn btn-xs btn-success activate-btn" data-id="' + t.id + '">Activate</button>' : '') +
          (t.id !== 'default' ? '<button class="btn btn-xs btn-ghost delete-btn" data-id="' + t.id + '" style="color:var(--danger)">Delete</button>' : '') +
        '</div></td>' +
      '</tr>';
    });
    tbody.innerHTML = html;

    tbody.querySelectorAll('.suspend-btn').forEach(function(btn) {
      btn.addEventListener('click', function() { updateTenant(btn.dataset.id, 'suspended'); });
    });
    tbody.querySelectorAll('.activate-btn').forEach(function(btn) {
      btn.addEventListener('click', function() { updateTenant(btn.dataset.id, 'active'); });
    });
    tbody.querySelectorAll('.delete-btn').forEach(function(btn) {
      btn.addEventListener('click', function() { deleteTenant(btn.dataset.id); });
    });
  }

  async function updateTenant(id, status) {
    try {
      await fetch('/api/tenants/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      loadTenants();
    } catch(e) { alert('Failed to update tenant.'); }
  }

  async function deleteTenant(id) {
    if (!confirm('Delete this tenant? All associated data will be orphaned.')) return;
    try {
      await fetch('/api/tenants/' + id, { method: 'DELETE' });
      loadTenants();
    } catch(e) { alert('Failed to delete tenant.'); }
  }

  // Modal
  el('newTenantBtn').addEventListener('click', function() {
    state.editingId = null;
    el('modalTitle').textContent = 'New Tenant';
    el('modalSave').textContent = 'Create Tenant';
    el('modalError').textContent = '';
    el('tenantName').value = '';
    el('tenantPlan').value = 'starter';
    el('tenantModal').classList.remove('hidden');
  });

  el('modalClose').addEventListener('click', function() { el('tenantModal').classList.add('hidden'); });
  el('modalCancel').addEventListener('click', function() { el('tenantModal').classList.add('hidden'); });

  el('modalSave').addEventListener('click', async function() {
    var name = el('tenantName').value.trim();
    if (!name) { el('modalError').textContent = 'Organization name is required.'; return; }
    try {
      var res = await fetch('/api/tenants', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, plan: el('tenantPlan').value })
      });
      if (!res.ok) { var err = await res.json().catch(function(){return{};}); throw new Error(err.error || 'Failed'); }
      el('tenantModal').classList.add('hidden');
      loadTenants();
    } catch(e) { el('modalError').textContent = e.message; }
  });

  async function boot() {
    await loadUser();
    await loadTenants();
  }
  boot();
})();
</script>
