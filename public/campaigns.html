<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attest — Campaigns</title>

<link rel="stylesheet" href="styles.css">




<script src="/components.js"></script>
<script src="/shared.js"></script>
</head>
<body class="has-sidebar">
<attest-sidebar active="campaigns"></attest-sidebar>

<div class="main">

<attest-topbar breadcrumb="Attest › <span>Campaigns</span>" search-placeholder="Search roles, approvers, campaigns..."></attest-topbar>

  <div class="content">
    <div class="content-header flex-between">
      <div><h1>Access Certification Campaigns</h1><p>Create and manage periodic access review campaigns for SOX, ITGC, ISO 27001, and internal compliance.</p></div>
      <button class="btn btn-primary" id="newCampaignBtn">+ New Campaign</button>
    </div>
    <div class="card"><div class="card-body no-pad">
      <table class="data-table"><thead><tr><th class="sortable">Campaign</th><th class="sortable">Framework</th><th class="sortable">Period</th><th class="sortable">Approvers</th><th>Roles</th><th>Progress</th><th class="sortable">Status</th><th></th></tr></thead>
        <tbody id="campaignsBody"><tr class="skeleton-row"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr class="skeleton-row"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr class="skeleton-row"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr></tbody>
      </table>
    </div></div>
  </div>
</div>

<div class="modal-backdrop hidden" id="campaignModal">
  <div class="modal modal-wide"><div class="modal-header"><h3>New Access Certification Campaign</h3><button class="modal-close" id="modalClose">✕</button></div>
    <div class="modal-body" style="display:grid;gap:14px">
      <div class="modal-error" id="modalError"></div>
      <div><label class="form-label">Campaign Name *</label><input class="form-input" id="campName" placeholder="e.g. Q4 SOX ITGC Access Review"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><label class="form-label">Framework *</label><select class="form-select" id="campFramework"><option value="SOX">SOX / ITGC</option><option value="ISO27001">ISO 27001</option><option value="SOC2">SOC 2</option><option value="GDPR">GDPR</option><option value="NIST">NIST 800-53</option><option value="COBIT">COBIT 2019</option></select></div>
        <div><label class="form-label">Period *</label><select class="form-select" id="campPeriod"><option>Q4 2026</option><option>H2 2026</option><option>Annual 2026</option><option>Ongoing</option></select></div>
      </div>
      <div><label class="form-label">Deadline</label><input class="form-input" type="date" id="campDeadline"></div>
      <div><label class="form-label">Approvers</label><select class="form-select" id="approverSelect" multiple style="min-height:100px"></select></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" id="modalCancel">Cancel</button><button class="btn btn-primary" id="modalSave">Create Campaign</button></div>
  </div>
<script>
(function(){
  var el=function(id){return document.getElementById(id);},state={campaigns:[]};
  // Auth handled by shared.js
// Fetch auth inject handled by shared.js

  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function fmtDate(iso){try{return new Date(iso).toLocaleDateString();}catch(e){return iso;}}

  // Sidebar user info handled by shared.js — no need to duplicate

  function loadCampaigns(){
    fetch('/api/campaigns').then(function(r){return r.json();}).then(function(data){
      state.campaigns=data;
      // Update badge
      var active=data.filter(function(c){return c.status==='active';}).length;
      var badge=el('campaignBadge');if(badge&&active>0){badge.textContent=active;badge.style.display='';}
      render();
    });
  }
  function render(){
    var tbody=el('campaignsBody');
    if(!state.campaigns.length){tbody.innerHTML='<tr><td colspan="8" class="text-sm text-muted" style="text-align:center;padding:30px">No campaigns yet. Create your first campaign to get started.</td></tr>';return;}
    var html='';
    state.campaigns.forEach(function(c){
      var fwBadge='badge-fw-'+ (c.framework||'').toLowerCase();
      var stBadge=c.status==='active'?'badge-info':c.status==='completed'?'badge-success':c.status==='draft'?'badge-purple':'badge-neutral';
      var stLabel=c.status==='active'?'In Progress':c.status==='completed'?'Completed':c.status==='draft'?'Scheduled':c.status;
      var totalRoles=Number(c.totalRoles)||0;
      var progressPct=Number(c.progress)||0;
      html+='<tr><td><strong>'+esc(c.name)+'</strong></td>'+
        '<td><span class="badge '+fwBadge+'">'+esc(c.framework)+'</span></td>'+
        '<td>'+esc(c.period)+'</td><td class="num">'+(c.approvers||[]).length+'</td>'+
        '<td class="num">'+totalRoles+'</td>'+
        '<td><div style="display:flex;align-items:center;gap:8px"><div class="progress-bar" style="width:80px"><div class="progress-fill '+(progressPct>=100?'fill-green':'fill-teal')+'" style="width:'+progressPct+'%"></div></div>'+progressPct+'%</div></td>'+
        '<td><span class="badge '+stBadge+'">'+stLabel+'</span></td>'+
        '<td><div class="btn-group">'+
          (c.status==='draft'?'<button class="btn btn-ghost btn-sm act-btn" data-action="active" data-id="'+c.id+'">Activate</button>':'')+
          (c.status==='active'?'<button class="btn btn-ghost btn-sm act-btn" data-action="completed" data-id="'+c.id+'">Complete</button>':'')+
          (c.status==='completed'?'<button class="btn btn-ghost btn-sm act-btn" data-action="archived" data-id="'+c.id+'">Archive</button>':'')+
          (c.status!=='active'?'<button class="btn btn-ghost btn-sm act-btn" data-action="delete" data-id="'+c.id+'" style="color:var(--danger)">Delete</button>':'')+
        '</div></td></tr>';
    });
    tbody.innerHTML=html;
    tbody.querySelectorAll('.act-btn').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();handleAction(b.dataset.action,b.dataset.id);});});
  }
  async function handleAction(action,id){
    if(action==='delete'){if(!await Attest.confirm('Delete this campaign?','Delete'))return;await fetch('/api/campaigns/'+id,{method:'DELETE'});loadCampaigns();return;}
    var ns={active:'active',completed:'completed',archived:'archived'}[action];if(!ns)return;
    await fetch('/api/campaigns/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:ns})});
    loadCampaigns();
  }
  function openModal(){el('campaignModal').classList.remove('hidden');el('modalError').textContent='';el('campName').value='';el('campDeadline').value='';
    fetch('/api/approvers').then(function(r){return r.json();}).then(function(a){var s=el('approverSelect');s.innerHTML='';a.forEach(function(n){var o=document.createElement('option');o.value=n;o.textContent=n;s.appendChild(o);});});
  }
  function closeModal(){
    var m=el('campaignModal');
    m.classList.add('closing');
    setTimeout(function(){m.classList.add('hidden');m.classList.remove('closing');},180);
  }
  el('newCampaignBtn').addEventListener('click',openModal);
  el('modalClose').addEventListener('click',closeModal);el('modalCancel').addEventListener('click',closeModal);
  el('modalSave').addEventListener('click',function(){
    var name=el('campName').value.trim();if(!name){el('modalError').textContent='Campaign name is required.';return;}
    var btn=el('modalSave');Attest.btnLoading(btn,true,'Creating…');
    var sel=el('approverSelect');var apps=[];for(var i=0;i<sel.options.length;i++){if(sel.options[i].selected)apps.push(sel.options[i].value);}
    fetch('/api/campaigns',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,framework:el('campFramework').value,period:el('campPeriod').value,deadline:el('campDeadline').value,approvers:apps})})
    .then(function(r){if(!r.ok)return r.json().then(function(e){throw new Error(e.error||'Failed');});closeModal();loadCampaigns();})
    .catch(function(e){el('modalError').textContent=e.message;})
    .finally(function(){Attest.btnLoading(btn,false);});
  });
  // Dark mode & sign out handled by shared.js — no need to duplicate
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
  loadCampaigns();
})();
</script>
<script src="/mobile.js"></script>
</div>
</div>
</div>


<attest-mobile-tabbar active="campaigns"></attest-mobile-tabbar>
</body>
</html>
