<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attest — API Keys</title>

<link rel="stylesheet" href="styles.css">




<script src="/components.js"></script>
<script src="/shared.js"></script>
</head>
<body class="has-sidebar">
<attest-sidebar active="api-keys"></attest-sidebar>

<div class="main">

<attest-topbar breadcrumb="Attest › <span>API Keys</span>" search-placeholder="Search keys…"></attest-topbar>

  <div class="content">
    <div class="content-header flex-between">
      <div><h1>API Keys</h1><p>Programmatic access for CI/CD pipelines, external dashboards, and integration with GRC platforms.</p></div>
      <button class="btn btn-primary" id="genKeyBtn">+ Generate New Key</button>
    </div>
    <div class="card"><div class="card-body no-pad">
      <table class="data-table"><thead><tr><th>Key Name</th><th>Prefix</th><th>Permissions</th><th>Created</th><th>Last Used</th><th></th></tr></thead>
        <tbody id="keysBody"><tr><td colspan="6" class="text-sm text-muted" style="text-align:center;padding:30px">Loading keys…</td></tr></tbody>
      </table>
    </div></div>
  </div>
</div>

<div class="modal-backdrop hidden" id="keyModal">
  <div class="modal"><div class="modal-header"><h3>Generate New API Key</h3><button class="modal-close" id="modalClose">✕</button></div>
    <div class="modal-body" style="display:grid;gap:14px">
      <div class="modal-error" id="modalError"></div>
      <div><label class="form-label">Key Name *</label><input class="form-input" id="keyName" placeholder="e.g. PwC Audit Integration"></div>
      <div><label class="form-label">Permissions</label><select class="form-select" id="keyPerms">
        <option value="read-only">Read-only audit</option>
        <option value="read-write">Read + Write RITM</option>
        <option value="health-check">Health check only</option>
      </select></div>
      <div id="keyResult" class="hidden" style="background:var(--success-light);border:1px solid var(--success);border-radius:8px;padding:14px">
        <div style="font-size:11px;font-weight:600;color:var(--success);margin-bottom:6px">✅ Key generated — copy it now. You won't see it again.</div>
        <div class="share-link-box" style="margin:0"><input type="text" readonly id="keyValue" style="font-family:monospace;font-size:11px" onclick="this.select()"><button class="btn btn-xs btn-primary copyKeyBtn">Copy</button></div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" id="modalCancel">Cancel</button><button class="btn btn-primary" id="modalGenerate">Generate Key</button></div>
  </div>
<script>
(function(){
  var el=function(id){return document.getElementById(id);},state={keys:[]};
  // Auth handled by shared.js
// Fetch auth inject handled by shared.js

  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function fmtDate(iso){try{return new Date(iso).toLocaleDateString();}catch(e){return iso;}}

  function loadKeys(){
    return Attest.api.json('/api/api-keys').then(function(data){state.keys=data;render();}).catch(function(err){Attest.showLoadError(document.querySelector('.content'),err.message||'Could not load API keys.',loadKeys);});
  }
  function render(){
    var tbody=el('keysBody');
    if(!state.keys.length){tbody.innerHTML='<tr><td colspan="6" class="text-sm text-muted" style="text-align:center;padding:30px">No API keys generated yet.</td></tr>';return;}
    var html='';
    state.keys.forEach(function(k){
      var permBadge=k.permissions==='read-write'?'badge-info':k.permissions==='health-check'?'badge-purple':'badge-teal';
      var permLabel=k.permissions==='read-write'?'Read + Write RITM':k.permissions==='health-check'?'Health check only':'Read-only audit';
      html+='<tr><td><strong>'+esc(k.name)+'</strong></td>'+
        '<td><span class="text-mono">'+esc(k.key_prefix)+'</span></td>'+
        '<td><span class="badge '+permBadge+'">'+permLabel+'</span></td>'+
        '<td>'+fmtDate(k.created_at)+'</td>'+
        '<td>'+(k.last_used_at?fmtDate(k.last_used_at):'Never')+'</td>'+
        '<td><button class="btn btn-ghost btn-xs revoke-btn" data-id="'+k.id+'" style="color:var(--danger)">Revoke</button></td></tr>';
    });
    tbody.innerHTML=html;
    tbody.querySelectorAll('.revoke-btn').forEach(function(b){b.addEventListener('click',function(){revokeKey(b.dataset.id);});});
  }
  async function revokeKey(id){if(!await Attest.confirm('Revoke this API key? It will stop working immediately.','Revoke Key'))return;try{await Attest.api.fetch('/api/api-keys/'+id,{method:'DELETE'});await loadKeys();}catch(err){Attest.showToast(err.message,'error');}}
  function openModal(){el('keyModal').classList.remove('hidden');el('modalError').textContent='';el('keyName').value='';el('keyResult').classList.add('hidden');el('modalGenerate').style.display='';el('modalGenerate').textContent='Generate Key';}
  function closeModal(){el('keyModal').classList.add('hidden');}
  el('genKeyBtn').addEventListener('click',openModal);
  el('modalClose').addEventListener('click',closeModal);el('modalCancel').addEventListener('click',closeModal);
  el('modalGenerate').addEventListener('click',function(){
    var name=el('keyName').value.trim();if(!name){el('modalError').textContent='Key name is required.';return;}
    var btn=el('modalGenerate');btn.disabled=true;btn.textContent='Generating...';
    Attest.api.json('/api/api-keys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,permissions:el('keyPerms').value})})
    .then(function(data){
      el('keyValue').value=data.key;el('keyResult').classList.remove('hidden');el('modalGenerate').style.display='none';
      loadKeys();
    })
    .catch(function(e){el('modalError').textContent=e.message;btn.disabled=false;btn.textContent='Generate Key';});
  });
  el('keyModal').addEventListener('click',function(e){
    if(e.target.classList.contains('copyKeyBtn')){var inp=el('keyValue');inp.select();navigator.clipboard.writeText(inp.value).then(function(){e.target.textContent='Copied!';setTimeout(function(){var b=document.querySelector('.copyKeyBtn');if(b)b.textContent='Copy';},1500);}).catch(function(err){Attest.showToast(err.message||'Could not copy key.','error');});}
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
  Attest.getCurrentUser().then(function(){if(!Attest.hasCapability('api-key:manage')){location.href='/dashboard.html';return;}return loadKeys();}).catch(function(err){Attest.showLoadError(document.querySelector('.content'),err.message||'Could not load API keys.',function(){location.reload();});});
})();
</script>
<script src="/mobile.js"></script>
</div>
</div>
</div>


<attest-mobile-tabbar active="api-keys"></attest-mobile-tabbar>
</body>
</html>
