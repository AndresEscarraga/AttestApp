<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attest — Dashboard</title>

<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>




<script src="/components.js"></script>
<script src="/shared.js"></script>
</head>
<body class="has-sidebar">
<attest-sidebar active="dashboard"></attest-sidebar>

<div class="main">

<attest-topbar breadcrumb="Attest › <span>Dashboard</span>" search-placeholder="Search roles, approvers, campaigns..."></attest-topbar>

  <div class="content">
    <div class="content-header">
        <h1 id="greeting">Welcome</h1>
      <p id="dashboardSubtitle">Loading your access certification overview…</p>
    </div>

    <!-- KPI Stat Cards -->
    <div class="stats-grid" id="kpiGrid">
      <div class="stat-card skeleton-card"><div class="stat-header"><span class="stat-label">Total Roles</span><span class="stat-icon icon-teal">⟳</span></div><div class="stat-value skeleton-pulse">—</div></div>
      <div class="stat-card skeleton-card"><div class="stat-header"><span class="stat-label">Certification Progress</span><span class="stat-icon icon-green">✓</span></div><div class="stat-value skeleton-pulse">—</div></div>
      <div class="stat-card skeleton-card"><div class="stat-header"><span class="stat-label">Pending Reviews</span><span class="stat-icon icon-amber">⟐</span></div><div class="stat-value skeleton-pulse">—</div></div>
      <div class="stat-card skeleton-card"><div class="stat-header"><span class="stat-label">SoD Conflicts</span><span class="stat-icon icon-purple">⚠</span></div><div class="stat-value skeleton-pulse">—</div></div>
    </div>

    <!-- Chart + Activity row -->
    <div class="chart-row">
      <div class="card">
        <div class="card-header flex-between">
          <h2>Certification Progress by System</h2>
          <span class="text-sm text-muted">This quarter</span>
        </div>
        <div class="card-body" style="min-height:220px">
          <canvas id="chartCanvas" style="max-height:200px"></canvas>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h2>Recent Activity</h2></div>
        <div class="card-body" id="recentActivity" style="padding:12px 16px;min-height:200px">
          <div class="text-sm text-muted" style="text-align:center;padding:40px 0">Loading…</div>
        </div>
      </div>
    </div>

    <!-- Active Campaigns -->
    <div class="card">
      <div class="card-header flex-between">
        <h2>Active Campaigns</h2>
        <button class="btn btn-primary btn-sm" id="newCampaignBtn" title="Coming in Phase 2">+ New Campaign</button>
      </div>
      <div class="card-body" id="activeCampaigns">
        <div class="text-sm text-muted" style="text-align:center;padding:20px">Loading campaigns…</div>
      </div>
    </div>
  </div>
<script>
(function() {
  'use strict';
  var el = function(id) { return document.getElementById(id); };

  // ── JWT token injection ──
  // Auth handled by shared.js
// Fetch auth inject handled by shared.js

  // ── Shared state ──
  var me = null;

  // ── Helpers ──
  function fmtDate(iso) { try { return new Date(iso).toLocaleString(); } catch(e) { return iso; } }
  function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function getTimeOfDay() {
    var h = new Date().getHours();
    if (h < 5) return 'night';
    if (h < 12) return 'morning';
    if (h < 18) return 'afternoon';
    return 'evening';
  }

  // ── Load user + update sidebar ──
  async function loadUser() {
    try {
      var res = await fetch('/api/me');
      me = await res.json().catch(function() { return {}; });
      if (!res.ok || !me.email) throw new Error('Auth failed');

      // Sidebar info
      var initials = (me.approverName || me.email || 'U').split(' ').map(function(n){return n[0];}).join('').substring(0,2).toUpperCase();
      el('sidebarAvatar').textContent = initials;
      el('sidebarName').textContent = me.approverName || me.email || 'User';
      el('sidebarRole').textContent = me.isAdmin ? 'Administrator' : 'Approver';

      // Greeting — use first name if available
      var displayName = me.approverName || (me.email ? me.email.split('@')[0].split('.')[0] : 'there');
      displayName = displayName.charAt(0).toUpperCase() + displayName.slice(1);
      el('greeting').textContent = 'Good ' + getTimeOfDay() + ', ' + displayName;

      // Show admin-only links
      if (me.isAdmin) {
        var adminLinks = document.querySelectorAll('.admin-only');
        for (var i = 0; i < adminLinks.length; i++) adminLinks[i].classList.remove('hidden');
      }

      // Populate tenant selector
      if (me.tenants && me.tenants.length > 1) {
        var sel = el('tenantSelector');
        sel.innerHTML = '';
        me.tenants.forEach(function(t) {
          var opt = document.createElement('option');
          opt.value = t.id;
          opt.textContent = t.name + (t.status !== 'active' ? ' (' + t.status + ')' : '');
          if (t.id === me.tenantId) opt.selected = true;
          sel.appendChild(opt);
        });
      }

      return me;
    } catch(e) {
      location.href = '/login.html';
    }
  }

  // ── Update sidebar badges ──
  function updateSidebarBadges(data) {
    var campaignBadge = el('campaignBadge');
    var reviewBadge = el('reviewBadge');
    var sodBadge = el('sodBadge');

    // Campaign badge: count of active campaigns
    fetch('/api/campaigns?status=active').then(function(r){return r.json();}).then(function(camps){
      if (campaignBadge && camps.length > 0) {
        campaignBadge.textContent = camps.length;
        campaignBadge.style.display = '';
      }
    }).catch(function(){});

    // Review badge: pending count from stats
    if (reviewBadge && data.pendingCount > 0) {
      reviewBadge.textContent = data.pendingCount;
      reviewBadge.style.display = '';
    }

    // SoD badge: open conflicts
    fetch('/api/sod/stats').then(function(r){return r.json();}).then(function(stats){
      if (sodBadge && stats.open > 0) {
        sodBadge.textContent = stats.open;
        sodBadge.style.display = '';
      }
    }).catch(function(){});
  }

  // ── KPI Stats ──
  async function loadStats() {
    try {
      var res = await fetch('/api/dashboard/stats');
      var data = await res.json();
      if (!res.ok) throw new Error('Failed to load stats');

      // Subtitle
      el('dashboardSubtitle').textContent =
        data.progress + '% of ' + data.totalRoles + ' roles certified. ' +
        data.pendingCount + ' pending review' + (data.pendingCount !== 1 ? 's' : '') + '.';

      // KPI grid — mockup style with icons
      var conflictColor = data.sodConflicts > 0 ? 'var(--danger)' : 'var(--success)';
      el('kpiGrid').innerHTML =
        '<div class="stat-card">' +
          '<div class="stat-header"><span class="stat-label">Total Roles Under Review</span><span class="stat-icon icon-teal">⟳</span></div>' +
          '<div class="stat-value">' + data.totalRoles + '</div>' +
          '<div class="stat-change up">Across all systems</div>' +
        '</div>' +
        '<div class="stat-card">' +
          '<div class="stat-header"><span class="stat-label">Certification Progress</span><span class="stat-icon icon-green">✓</span></div>' +
          '<div class="stat-value">' + data.progress + '%</div>' +
          '<div style="margin-top:8px"><div class="progress-bar"><div class="progress-fill fill-green" style="width:' + data.progress + '%"></div></div></div>' +
        '</div>' +
        '<div class="stat-card">' +
          '<div class="stat-header"><span class="stat-label">Pending Approver Actions</span><span class="stat-icon icon-amber">⟐</span></div>' +
          '<div class="stat-value" style="color:' + (data.pendingCount > 0 ? 'var(--warning)' : 'var(--success)') + '">' + data.pendingCount + '</div>' +
          '<div class="stat-change' + (data.pendingCount > 0 ? ' down' : '') + '">' + (data.pendingCount > 0 ? data.pendingCount + ' actions awaiting review' : 'All caught up!') + '</div>' +
        '</div>' +
        '<div class="stat-card">' +
          '<div class="stat-header"><span class="stat-label">SoD Conflicts Detected</span><span class="stat-icon icon-purple">⚠</span></div>' +
          '<div class="stat-value" style="color:' + conflictColor + '">' + data.sodConflicts + '</div>' +
          '<div class="stat-change' + (data.sodConflicts > 0 ? ' down' : '') + '">' + (data.sodConflicts > 0 ? 'Needs review' : 'No conflicts detected') + '</div>' +
        '</div>';

      // Update sidebar badges
      updateSidebarBadges(data);

      // Recent activity timeline
      renderActivity(data.recentActivity || []);

      // Timestamp
      el('lastUpdated').textContent = 'Updated ' + fmtDate(new Date().toISOString());
    } catch(e) {
      el('dashboardSubtitle').textContent = 'Could not load dashboard data.';
      el('kpiGrid').innerHTML = '<div class="stat-card" style="grid-column:1/-1;text-align:center;padding:24px"><p style="color:var(--danger);font-weight:600;margin-bottom:8px">Failed to load dashboard</p><button class="btn btn-primary btn-sm" onclick="location.reload()">Retry</button></div>';
      if (window.Attest && Attest.showToast) Attest.showToast('Could not load dashboard stats.', 'error');
      console.error('Dashboard stats error:', e);
    }
  }

  function renderActivity(events) {
    if (!events.length) {
      el('recentActivity').innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--text-tertiary)"><div style="font-size:24px;margin-bottom:6px">📭</div><div class="text-sm">No activity yet</div></div>';
      return;
    }
    var html = '';
    events.forEach(function(e) {
      var dotColor = e.type === 'SUBMISSION' ? 'var(--success)' :
                     e.type === 'AUTH' ? 'var(--accent)' :
                     e.type === 'RITM' ? 'var(--warning)' : 'var(--purple)';
      html += '<div class="timeline-item">' +
        '<div class="timeline-dot" style="background:' + dotColor + '"></div>' +
        '<div class="timeline-content">' +
          '<div class="tl-title">' + escHtml(e.detail || e.action) + '</div>' +
          '<div class="tl-time">' + fmtDate(e.timestamp) + ' · ' + escHtml(e.email) + '</div>' +
        '</div>' +
      '</div>';
    });
    el('recentActivity').innerHTML = html;
  }

  // ── Progress-by-system chart ──
  // ── Progress-by-system chart (Chart.js) ──
  var chartInstance = null;
  async function loadChart() {
    try {
      var res = await fetch('/api/dashboard/progress-by-system');
      var systems = await res.json();
      if (!res.ok) throw new Error('API error');
      var canvas = el('chartCanvas');
      if (!canvas) return;
      if (!systems || !systems.length) {
        var ctx = canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.font='12px Inter'; ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--text-tertiary');
        ctx.textAlign='center'; ctx.fillText('No system data available.', canvas.width/2, canvas.height/2);
        return;
      }
      if (chartInstance) chartInstance.destroy();
      var colors = ['#0891B2','#059669','#D97706','#DC2626','#7C3AED','#2563EB','#EC4899','#F59E0B'];
      chartInstance = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: systems.map(function(s){return s.name;}),
          datasets: [{ label: 'Certified %', data: systems.map(function(s){return s.pct;}), backgroundColor: systems.map(function(_,i){return colors[i % colors.length];}), borderRadius: 4 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { max: 100, ticks: { callback: function(v){return v+'%';} }, grid: { color: 'rgba(0,0,0,.06)' } }, x: { grid: { display: false } } } }
      });
    } catch(e) { console.error('Chart error:', e); }
  }

  // ── Active campaigns ──
  async function loadCampaigns() {
    try {
      var res = await fetch('/api/dashboard/active-campaigns');
      var campaigns = await res.json();
      if (!res.ok) throw new Error('API error');

      if (!campaigns || !campaigns.length) {
        el('activeCampaigns').innerHTML =
          '<div class="empty-state">' +
            '<div class="es-icon">📋</div>' +
            '<div style="font-weight:600;margin-bottom:4px">No active campaigns</div>' +
            '<div class="text-sm">Create your first certification campaign to start tracking progress.</div>' +
          '</div>';
        return;
      }

      var html = '<div class="campaign-row">';
      campaigns.forEach(function(c) {
        var badgeClass = c.status === 'active' ? 'badge-info' : c.status === 'completed' ? 'badge-success' : c.status === 'draft' ? 'badge-purple' : 'badge-neutral';
        var badgeText = c.status === 'active' ? 'In Progress' : c.status === 'completed' ? 'Completed' : c.status === 'draft' ? 'Scheduled' : c.status;
        html += '<div class="campaign-card" onclick="location.href=\'/campaigns.html\'">';
        html += '<div class="cc-header"><span class="cc-title">' + escHtml(c.name) + '</span><span class="badge ' + badgeClass + '">' + badgeText + '</span></div>';
        html += '<div class="cc-meta">' + c.approvers + ' approvers · ' + c.totalRoles + ' roles · ' + (c.deadline ? 'Due ' + new Date(c.deadline).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : 'No deadline') + '</div>';
        html += '<div class="cc-progress"><div class="cc-progress-info"><span>' + c.progress + '% certified</span><span>' + c.reviewedRoles + '/' + c.totalRoles + '</span></div>';
        html += '<div class="progress-bar"><div class="fill ' + (c.progress >= 100 ? 'fill-green' : 'fill-teal') + '" style="width:' + c.progress + '%"></div></div></div>';
        html += '</div>';
      });
      html += '</div>';
      el('activeCampaigns').innerHTML = html;
    } catch(e) {
      el('activeCampaigns').innerHTML = '<div class="text-sm text-muted" style="text-align:center;padding:20px">Campaign data unavailable</div>';
    }
  }

  // ── Event listeners ──
  // Dark mode & sign out handled by shared.js — no need to duplicate here

  var newCampaignBtn = el('newCampaignBtn');
  if (newCampaignBtn) {
    newCampaignBtn.addEventListener('click', function() {
      location.href = '/campaigns.html';
    });
  }

  // Theme handled by shared.js — no need to duplicate here

  // ── Boot sequence ──
  async function boot() {
    await loadUser();
    // Load all data in parallel
    await Promise.all([loadStats(), loadChart(), loadCampaigns()]);
  }

  boot().catch(function(err) {
    console.error('Dashboard boot failed:', err);
    if (window.Attest && Attest.showToast) Attest.showToast('Dashboard failed to load. Please refresh.', 'error');
  });

  // ── Search: filter activity items and campaigns ──
  document.addEventListener('attest:search', function(e) {
    var q = (e.detail.query || '').toLowerCase();
    // Filter activity timeline items
    var items = document.querySelectorAll('#recentActivity .timeline-item');
    items.forEach(function(item) {
      var text = (item.textContent || '').toLowerCase();
      item.classList.toggle('search-hidden', q && text.indexOf(q) === -1);
    });
    // Filter campaign cards
    var cards = document.querySelectorAll('#activeCampaigns .campaign-card');
    cards.forEach(function(card) {
      var text = (card.textContent || '').toLowerCase();
      card.classList.toggle('search-hidden', q && text.indexOf(q) === -1);
    });
  });
})();
</script>
<script src="/mobile.js"></script>
</div>
</div>
</div>


<attest-mobile-tabbar active="dashboard"></attest-mobile-tabbar>
</body>
</html>
