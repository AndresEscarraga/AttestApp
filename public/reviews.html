  <div class="content">
    <div class="content-header flex-between">
      <div>
        <h1>My Role Reviews</h1>
        <p>Review and certify each business role assigned to you. You must acknowledge all permissions before submitting.</p>
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary" id="saveDraftBtn">Save Draft</button>
        <button class="btn btn-primary" id="printBtn">Submit Certification</button>
      </div>
    </div>

    <div class="stats-grid" id="reviewStats" style="grid-template-columns:repeat(4, 1fr)">
      <div class="stat-card"><div class="stat-label">Assigned Roles</div><div class="stat-value" style="font-size:24px" id="statAssigned">—</div></div>
      <div class="stat-card"><div class="stat-label">Reviewed</div><div class="stat-value" style="font-size:24px;color:var(--success)" id="statReviewed">—</div></div>
      <div class="stat-card"><div class="stat-label">Pending Review</div><div class="stat-value" style="font-size:24px;color:var(--warning)" id="statPending">—</div></div>
      <div class="stat-card"><div class="stat-label">Rejected</div><div class="stat-value" style="font-size:24px;color:var(--danger)" id="statRejected">—</div></div>
    </div>

    <div class="card">
      <div class="card-body no-pad">
        <div class="table-scroll">
          <table class="data-table" id="reviewTable">
            <thead>
              <tr>
                <th class="sortable">Business Role</th>
                <th class="sortable">System</th>
                <th>Technical Roles</th>
                <th class="sortable">Status</th>
                <th>Action</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="reviewTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="app-footer">
      <p class="text-sm text-muted" id="submitWarning"></p>
    </div>
  </div>
</div>

<!-- Completion Modal -->
<div class="modal-backdrop hidden" id="completionModal">
  <div class="modal">
    <h2>Review Completed</h2>
    <p>Your review has been submitted successfully.</p>
    <p class="completion-detail" id="completionDetail"></p>
    <div class="modal-footer">
      <button class="btn btn-primary" id="newReviewBtn">Make a new review</button>
    </div>
  </div>
