  <div class="content">
    <div class="content-header">
      <h1>Activity Log</h1>
      <p>Application activity across the whole app: authentication and page access, review submissions, and RITM changes. Newest events first.</p>
    </div>

    <div class="card mb-16">
      <div class="card-header"><h2>Filters</h2></div>
      <div class="card-body">
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
          <div class="form-group" style="margin:0">
            <label class="form-label">Type</label>
            <select class="form-select" id="filterType">
              <option value="">All</option>
              <option value="AUTH">Authentication / access</option>
              <option value="SUBMISSION">Submissions</option>
              <option value="RITM">RITM changes</option>
            </select>
          </div>
          <div class="form-group" style="margin:0">
            <label class="form-label">User</label>
            <input class="form-input" id="filterUser" type="search" placeholder="Type to filter..." />
          </div>
          <div class="form-group" style="margin:0">
            <label class="form-label">From</label>
            <input class="form-input" id="filterFrom" type="date" />
          </div>
          <div class="form-group" style="margin:0">
            <label class="form-label">To</label>
            <input class="form-input" id="filterTo" type="date" />
          </div>
          <div style="display:flex;gap:8px">
            <button id="refreshBtn" class="btn btn-secondary">Refresh</button>
            <button id="exportCsvBtn" class="btn btn-primary">Export CSV</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h2>Events</h2></div>
      <div class="card-body no-pad">
        <div class="table-scroll">
          <table class="data-table" id="activityTable">
            <thead>
              <tr><th>Timestamp</th><th>Type</th><th>Action</th><th>User</th><th>Detail</th></tr>
            </thead>
            <tbody id="activityBody"></tbody>
          </table>
        </div>
        <p class="text-sm text-muted" style="padding:16px;display:none" id="activityEmpty">No activity matches the current filters.</p>
      </div>
    </div>
  </div>
<script src="activity.js"></script>
