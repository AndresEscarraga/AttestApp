<!-- Topbar component — injected by build.js -->
<!-- Placeholders: {{breadcrumb}} {{searchPlaceholder}} {{lastUpdated}} -->
<header class="topbar">
  <div class="topbar-breadcrumb">{{breadcrumb}}</div>
  <div class="topbar-search"><span class="search-icon">⌕</span><input type="search" placeholder="{{searchPlaceholder}}"></div>
  <div class="topbar-actions">
    <span class="text-sm text-muted" id="lastUpdated">{{lastUpdated}}</span>
    <select class="lang-select" id="langSelect"><option value="EN">EN</option><option value="ES">ES</option></select>
    <button class="topbar-btn dark-toggle" id="darkToggleTop" title="Toggle dark mode">🌙</button>
    <button class="topbar-btn" title="Notifications">🔔<span class="dot"></span></button>
    <button class="topbar-btn" title="Help">?</button>
  </div>
</header>
